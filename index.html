<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Os Contos de Beedle, o Bardo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Passo 1: Estrutura HTML Básica -->
  <div id="tela-capa" class="capa-container">
    <div class="capa-livro">
      <h1>Os Contos de Beedle</h1>
      <button class="btn-abrir" onclick="abrirLivro()">Abrir Livro</button>
    </div>
  </div>

  <!-- Passo 5 e 6: Grid e Responsividade -->
  <div id="tela-livro" class="container" style="display: none;">
    <header class="header-casa">
      <h2>Skins das Casas</h2>
      <div class="botoes-skins">
        <!-- Passo 10: Eventos com onclick -->
        <button onclick="mudarCasa('skin-grifinoria')">Grifinória</button>
        <button onclick="mudarCasa('skin-sonserina')">Sonserina</button>
      </div>
    </header>

    <main class="main-content">
      <!-- Passo 11: Container onde os botões serão inseridos dinamicamente -->
      <aside id="menu-contos" class="menu-lateral">
        <h3>Contos</h3>
        <div id="lista-botoes"></div>
      </aside>

      <!-- Passo 9: Elementos manipulados via DOM -->
      <section class="leitura-container">
        <h2 id="contoTitulo">Selecione um conto</h2>
        <p id="contoResumo">Clique em um dos títulos ao lado para ler o resumo.</p>
        <div id="contoNota" style="display: none;">
          <p><em>Nota do Professor Dumbledore incluída nesta edição.</em></p>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
